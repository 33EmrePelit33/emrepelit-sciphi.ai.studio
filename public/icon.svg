<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Emre Pelit — Sci-Phil Bilim ve Felsefe Uygulama İkonu">
  <defs>
    <radialGradient id="sciphilBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="65%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Full-bleed rounded academic seal background -->
  <rect width="512" height="512" rx="112" fill="url(#sciphilBg)" />
  <!-- Outer academic seal rings -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.9" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55" />
  <circle cx="256" cy="256" r="164" fill="none" stroke="#1D4ED8" stroke-width="1.2" opacity="0.45" />
  <!-- Quantum Atom & Spacetime Orbitals -->
  <g transform="translate(256 256)" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
    <ellipse rx="168" ry="62" transform="rotate(0)" />
    <ellipse rx="168" ry="62" transform="rotate(60)" />
    <ellipse rx="168" ry="62" transform="rotate(120)" />
  </g>
  <!-- Quantum Orbital Nodes -->
  <circle cx="88" cy="256" r="8" fill="#FDE68A" />
  <circle cx="424" cy="256" r="8" fill="#FDE68A" />
  <circle cx="172" cy="110" r="7" fill="#38BDF8" />
  <circle cx="340" cy="402" r="7" fill="#38BDF8" />
  <circle cx="340" cy="110" r="7" fill="#34D399" />
  <circle cx="172" cy="402" r="7" fill="#34D399" />
  <!-- Center Core & Golden Phi (Φ) Emblem -->
  <circle cx="256" cy="256" r="58" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="4" />
  <text x="256" y="283" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700">Φ</text>
</svg>
